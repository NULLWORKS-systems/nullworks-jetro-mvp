<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8, user-scalable=yes, viewport-fit=cover">
  <title>NULLWORKS architecture — full size</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #05070a; color: #edf4f6; font-family: system-ui, sans-serif; height: 100%; }
    .bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
      background: rgba(5,7,10,.94);
      border-bottom: 1px solid #293236;
    }
    .bar a { color: #eaf6ff; text-decoration: none; font-weight: 800; font-size: 13px; }
    .bar span { color: #9aa8ae; font-size: 11px; letter-spacing: .04em; }
    .scroller {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
      height: calc(100dvh - 52px);
      padding: 10px 10px 28px;
    }
    img {
      display: block;
      width: 1600px;
      max-width: none;
      height: auto;
      margin: 0 auto;
    }
    @media (min-width: 1100px) {
      img { width: min(1600px, 100%); }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="/">← Back to NULLWORKS</a>
    <span>Pinch, pan, or scroll to read</span>
  </div>
  <div class="scroller">
    <img src="/nullworks-architecture.jpg" alt="NULLWORKS architecture: a layer above AI. Plug in any AI. Execute in the real world.">
  </div>
</body>
</html>
