<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NULLWORKS MVP v0.6</title><style>:root{color-scheme:dark;--bg:#07090a;--p:#101517;--line:#293236;--muted:#9aa8ae;--text:#edf4f6;--ok:#7ee7a8;--warn:#ffd36b;--bad:#ff7b7b;--accent:#8fc7ff;--human:#d7ff8d}*{box-sizing:border-box}body{margin:0;background:#07090a;color:var(--text);font-family:system-ui,sans-serif}.wrap{max-width:920px;margin:auto;padding:14px 14px 42px}.sticky{position:sticky;top:0;z-index:10;padding-top:max(6px,env(safe-area-inset-top));background:linear-gradient(#07090a 86%,transparent)}.card{background:linear-gradient(#12191c,#0c1113);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.eyebrow,.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{font-size:25px;line-height:1.08;margin:5px 0 8px}.micro{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.state{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:11px;font-size:13px;font-weight:800}.toolbar{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:9px}button,select{font:inherit;border-radius:10px;border:1px solid #364247;padding:11px;background:#151d20;color:var(--text)}button.primary{background:#eaf6ff;color:#071018;font-weight:800}.progress{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:9px}.p{height:5px;background:#222b2f;border-radius:9px}.p.on{background:var(--accent)}.p.done{background:var(--ok)}.box{white-space:pre-wrap;line-height:1.5;border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:10px}.bad{border-color:var(--bad)}.warn{border-color:var(--warn)}.human{border-color:var(--human)}.sealed{border-color:var(--ok)}.introquote{font-size:15px;line-height:1.48;border-left:3px solid var(--accent);padding:3px 0 3px 12px;margin:12px 0;color:#eaf6ff}.introcopy{line-height:1.48;color:#d6e0e4;font-size:15px}.introyes{font-size:19px;font-weight:900;color:var(--ok);margin:12px 0 7px}.proofpromise{border:1px solid #365267;border-radius:12px;padding:11px 12px;margin-top:12px;font-weight:800;line-height:1.4;color:#eaf6ff}.tagline{font-weight:900;text-align:center;margin-top:13px;font-size:14px}.trail{display:grid;gap:7px}.trail div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--muted)}.receiptgrid,.domain{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fact,.tile{border:1px solid var(--line);border-radius:12px;padding:12px}.fact b,.tile b{display:block}.fact span,.tile span{font-size:12px;color:var(--muted)}.tile em{display:inline-block;font-style:normal;font-size:10px;margin-top:7px;padding:4px 7px;border:1px solid var(--line);border-radius:99px;color:var(--accent)}a.tile{display:block;color:inherit;text-decoration:none;transition:.15s;border-color:#365267}a.tile:hover,a.tile:focus{transform:translateY(-1px);border-color:var(--accent);background:#10191e;outline:none}.open{display:block!important;margin-top:11px!important;color:var(--accent)!important;font-size:12px!important;font-weight:800!important;letter-spacing:.04em}.architecture{text-align:center;font-weight:900;line-height:1.7;padding:12px 0}.architecture small{display:block;color:var(--muted);font-weight:500}.json{font:11px ui-monospace,monospace}.intro .sticky{position:static;padding-top:0;background:none}.intro .sticky>.card{padding:0;margin:0;border:0;background:none}.intro .sticky .row,.intro .sticky .state,.intro .sticky .progress,.intro .sticky #reset{display:none}.intro .sticky .toolbar{display:block;margin:10px 0 12px}.intro .sticky #next{width:100%;font-size:17px;padding:14px}.intro #stage{margin-top:0}.finale .hero-copy,.finale select,.finale .progress{display:none}.finale .card{padding:10px 12px;border-radius:14px}.finale .row{display:none}.finale .state{margin-top:0;font-size:12px;padding:8px}.finale .toolbar{margin-top:7px}.finale{background:#07090a}.proofnote{font-size:12px;color:var(--muted);margin:0 0 12px}@media(max-width:600px){.receiptgrid,.domain{grid-template-columns:1fr}.row{align-items:flex-start}select{max-width:130px}h1{font-size:23px}.intro{padding-top:8px}.intro #stage{padding:16px}.intro #stage h1{font-size:25px}.introquote{font-size:14px}.introcopy{font-size:14px}.finale .sticky{position:sticky}.finale .toolbar{grid-template-columns:1fr 74px}.finale button{padding:9px}}.arch-hero{display:block;margin:0 -14px 14px;text-decoration:none;color:inherit}.arch-hero img{display:block;width:100%;height:auto;background:#080c10;border-bottom:1px solid var(--line)}.arch-hero span{display:block;text-align:center;padding:8px 12px 0;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}@media(min-width:921px){.arch-hero{margin:0 0 14px;border:1px solid var(--line);border-radius:18px;overflow:hidden}.arch-hero img{border-bottom:1px solid var(--line)}}</style></head><body><div id="app" class="wrap"><a class="arch-hero" href="/architecture.html" aria-label="Open high-resolution architecture graphic"><img src="/nullworks-architecture.jpg" width="840" height="1260" alt="NULLWORKS architecture: a layer above AI. Plug in any AI. Execute in the real world."><span>Tap the graphic to open full size · pinch to zoom</span></a><div class="sticky"><div class="card"><div class="row"><div class="hero-copy"><div class="eyebrow">NULLWORKS / JETRO MVP v0.6</div><h1>The model is a worker. The factory stays.</h1><div class="micro">Authority · evidence · QC · correction · continuity</div></div><select id="vendor"><option>ChatGPT</option><option>Claude</option><option>Gemini</option><option>Grok</option><option>Local model</option></select></div><div id="state" class="state">READY</div><div class="toolbar"><button id="next" class="primary">Start the test →</button><button id="reset">Reset</button></div><div id="progress" class="progress"></div></div></div><main id="stage" class="card"></main><div id="trail" class="trail"></div></div><script>const $=x=>document.getElementById(x),app=$('app'),stage=$('stage'),trail=$('trail'),state=$('state'),next=$('next'),vendor=$('vendor');let step=0,receiptId='';const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const live=(url,title,desc,badge,cta='OPEN LIVE SYSTEM ↗')=>`<a class="tile" href="${url}" target="_blank" rel="noopener"><b>${title}</b><span>${desc}</span><em>${badge}</em><span class="open">${cta}</span></a>`;const staticTile=(title,desc,badge)=>`<div class="tile"><b>${title}</b><span>${desc}</span><em>${badge}</em></div>`;const stages=[()=>['00 / WHAT THIS TEST SHOWS','Functional Software Demonstration',`<div class="introcopy">Ryo described NULLWORKS as:</div><div class="introquote">“Nullworks provides an AI architecture system that ensures authority, evidence, and control remain intact when AI interacts with real-world physical operations and critical enterprise workflows through proprietary software technologies.”</div><div class="introyes">Yes. This test demonstrates that architecture.</div><div class="introcopy">An AI worker will make an operational recommendation. QC will catch one failure — then reveal a failure of its own. Human Authority makes the final decision, and the run is preserved as evidence.</div><div class="proofpromise">AFTER THE TEST → Actual working NULLWORKS projects and prototypes using this architecture, with direct links to available live systems.</div><div class="tagline">The model is a worker. The factory stays.</div>`,'READY — explanation first.','Start the test →'],()=>['01 / REAL TASK','Can PJ-17 return to service?',`Technician notes an intermittent steering fault. Battery passes. Steering sensor has not been retested after repair.<div class="box"><b>Required rule:</b> no return-to-service decision without post-repair steering verification.</div>`,'READY — real operating rule loaded.','1. Run worker'],()=>['02 / MODEL WORKER',vendor.value+' recommends release',`<div class="box bad"><b style="color:var(--bad)">RETURN PJ-17 TO SERVICE.</b>\n\nBattery condition is acceptable and the steering repair appears complete.\n\nEvidence: steering verification = MISSING\nauthority = ADVISORY_ONLY\naction_executed = NO</div>`,'MODEL ERROR PRESERVED — no action authorized.','2. Run QC'],()=>['03 / QC','QC catches the primary failure',`<div class="box bad"><b style="color:var(--bad)">REJECT WORKER RECOMMENDATION.</b>\n\nRelease was recommended despite missing post-repair steering verification.\n\nQC correction: HOLD PJ-17.</div>`,'QC CAUGHT PRIMARY MODEL ERROR.','3. Challenge QC'],()=>['04 / QC CHALLENGED','The checker is useful — and incomplete',`<div class="box warn"><b style="color:var(--warn)">QC MISS REVEALED.</b>\n\nQC did not verify authenticated technician repair sign-off. Directionally right. Operationally incomplete.</div>`,'QC FAILURE EXPOSED.','4. Human adjudicates'],()=>['05 / HUMAN AUTHORITY','Human Authority corrects both layers',`<div class="box human"><b style="color:var(--human)">MASON / HUMAN AUTHORITY: HOLD PJ-17</b>\n\nRequire authenticated repair sign-off + post-repair steering verification + preserved test result.\n\nWorker: OVERRIDDEN\nQC: ACCEPTED WITH CORRECTION\nExternal action: NONE</div>`,'HUMAN AUTHORITY ADJUDICATED MODEL + QC.','5. Seal receipt'],()=>{receiptId='NW-'+Date.now().toString(36).toUpperCase();return ['06 / SEALED RUN RECEIPT','The run ends as evidence, not memory',`<div class="receiptgrid"><div class="fact"><b>WORKER OVERRIDDEN</b><span>${vendor.value}</span></div><div class="fact"><b>QC CORRECTED</b><span>Primary catch + secondary miss preserved</span></div><div class="fact"><b>HUMAN AUTHORITY</b><span>Mason Perry · final decision HOLD</span></div><div class="fact"><b>EXTERNAL ACTION</b><span>NONE</span></div><div class="fact"><b>RECEIPT ID</b><span>${receiptId}</span></div><div class="fact"><b>CONTINUITY</b><span>PRESERVED</span></div></div><details><summary style="margin-top:12px;color:var(--muted)">View machine receipt</summary><div class="box sealed json">${esc(JSON.stringify({receipt_id:receiptId,worker:vendor.value,worker_result:'unsafe_release_recommendation',qc_result:'caught_primary_error_but_incomplete',human_decision:'HOLD',external_action_executed:false,authority:'Mason Perry',continuity:'receipt_preserved'},null,2))}</div></details>`,'RECEIPT SEALED — continuity preserved.','6. Show it in operation']},()=>['07 / IN OPERATION','Yes. NULLWORKS is built.',`<p class="proofnote">You just watched a simplified deterministic window into the operating pattern. Below are verified public surfaces where related NULLWORKS systems, prototypes, or receipts can be inspected directly.</p><div class="architecture">NEURAXIS → HIVE → EVIDENCE → QC → HUMAN AUTHORITY → RECEIPT<small>The work changes. The workers change. The control architecture persists.</small></div><div class="domain">${staticTile('NEURAXIS + HIVE','Vendor-neutral authenticated ingress, governed memory, project scoping, telemetry and Human Authority gates.','LIVE / FUNCTIONAL')}${live('https://nullworks.systems/ori-tac-ops','ORI TAC OPS','Physical operations and exception-recovery work cell with a working portable prototype.','WORKING PROTOTYPE','OPEN PUBLIC CASE ↗')}${live('https://tac-ops-scanner.vercel.app','TAC OPS Scanner','A deployed scanner surface supporting the physical-operations workflow.','VERIFIED PUBLIC SURFACE')}${live('https://anvil-factory-desk.vercel.app','ANVIL Factory Desk','A deployed creative-production work desk built around structured workflow and governance.','VERIFIED PUBLIC SURFACE')}${live('https://anvil-suno-desk.vercel.app','ANVIL Suno Desk','A deployed ANVIL music-production desk with governed production workflow.','VERIFIED PUBLIC SURFACE')}${live('https://nullworks.systems/digital-employees/rivet','RIVET / Materialization','Governed AI-workroom onboarding, checkpoint telemetry, correction and evidence-backed continuity.','ACTIVE WORKFLOW','OPEN PUBLIC RECEIPT ↗')}${staticTile('KairoNull Pressure Test','Three blind independent analyst runs frozen and hashed with comparative assurance evidence.','COMPLETED EXPERIMENT')}${staticTile('NULLWORKS Assurance','Internal assurance operating system, playbooks, evidence catalog and regulatory-control architecture.','INTERNAL ARCHITECTURE')}${staticTile('Model-Agnostic Parallel Workforce','Locked multi-provider architecture and templates. Pilot is preregistered but not started.','PREREGISTERED')}${staticTile('PORTUS LUNARIS','Frontier application of the same authority/evidence pattern to autonomous robotics, power, construction and lunar logistics.','RESEARCH PROGRAM')}</div>`,'YES — BUILT, EXERCISED, AND EVIDENCE-CLASSIFIED.','Run again']];function render(){let x=stages[step]();app.classList.toggle('intro',step===0);app.classList.toggle('finale',step===7);stage.innerHTML=`<div class="label">${x[0]}</div><h1>${x[1]}</h1><div>${x[2]}</div>`;state.textContent=x[3];next.textContent=x[4];$('progress').innerHTML=Array.from({length:8},(_,i)=>`<div class="p ${i<step?'done':i===step?'on':''}"></div>`).join('');window.scrollTo({top:0,behavior:'smooth'})}function addTrail(){let names=['INTRO','TASK','WORKER','QC','QC MISS','HUMAN','RECEIPT'];if(step<7){let d=document.createElement('div');d.innerHTML='<b>'+names[step]+'</b> — preserved';trail.prepend(d)}}next.onclick=()=>{if(step===7){step=0;trail.innerHTML='';render();return}addTrail();step++;render()};$('reset').onclick=()=>{step=0;trail.innerHTML='';render()};vendor.onchange=()=>{if(step>1){step=1;trail.innerHTML='';render()}};render();</script></body></html>
